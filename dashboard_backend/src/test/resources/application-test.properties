# 테스트 전용 설정 (@ActiveProfiles("test"))
# 외부 DB·MQTT 브로커 없이 실행되도록 H2 메모리 DB를 쓰고 MQTT는 끈다.
# 테스트 컨텍스트마다 별도 메모리 DB를 쓰도록 이름에 무작위 값을 붙인다
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=VALUE,USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

jwt.secret=test-only-jwt-secret-key-that-is-long-enough-for-hs256
mqtt.enabled=false
influxdb.url=http://localhost:8181
influxdb.token=
app.cors.allowed-origins=http://localhost:5173
