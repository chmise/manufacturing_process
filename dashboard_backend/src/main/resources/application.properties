# ===================================
# Spring Boot Dashboard Backend Configuration
#
# 비밀값(DB 비밀번호, 토큰, 키)은 이 파일에 적지 않습니다.
# 환경변수로 넣거나, 저장소 루트의 .env 파일(git에 올라가지 않음)에 적어주세요.
# 필요한 변수 목록은 저장소 루트의 .env.example에 있습니다.
# ===================================

server.port=${SERVER_PORT:8080}
spring.application.name=dashboard-backend

# nginx 같은 리버스 프록시 뒤에서 X-Forwarded-* 헤더를 신뢰 (원래 주소/프로토콜 복원)
server.forward-headers-strategy=native

# 로컬 실행(./gradlew bootRun) 시 .env 파일을 읽습니다. 파일이 없으면 건너뜁니다.
# - dashboard_backend/.env 또는 저장소 루트의 .env
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ===================================
# PostgreSQL (메인 DB)
# ===================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:manufacturing_dashboard}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:${POSTGRES_USER:postgres}}
spring.datasource.password=${DB_PASSWORD:${POSTGRES_PASSWORD:}}

# 커넥션 풀
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===================================
# JPA / Hibernate (방언은 Hibernate가 자동으로 감지)
# ===================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=false

# ===================================
# InfluxDB 3.x (시계열 데이터, 선택 사항)
# ===================================
influxdb.url=${INFLUXDB_URL:http://localhost:8181}
influxdb.token=${INFLUXDB_TOKEN:}
influxdb.database=${INFLUXDB_DATABASE:factory}

# ===================================
# JWT
# JWT_SECRET은 기본값이 없습니다. 비어 있으면 서버가 시작되지 않습니다. (32바이트 이상)
# ===================================
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_SECONDS:86400}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_SECONDS:604800}

# ===================================
# MQTT
# ===================================
mqtt.enabled=${MQTT_ENABLED:true}
mqtt.broker.url=${MQTT_BROKER_URL:tcp://localhost:1883}

# ===================================
# CORS / WebSocket 허용 출처 (쉼표로 구분, 패턴 사용 가능)
# 프론트엔드를 다른 주소에서 띄울 때 그 주소를 추가하세요.
# ===================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ===================================
# JSON
# ===================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-durations-as-timestamps=false

# ===================================
# 로그
# ===================================
logging.root.level=WARN
logging.level.com.u1mobis.dashboard_backend.mqtt=INFO
logging.level.com.u1mobis.dashboard_backend.service.KPICalculationService=INFO
logging.level.org.hibernate.SQL=WARN

# ===================================
# 관리 엔드포인트 (컨테이너 헬스체크용 health만 공개)
# ===================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
