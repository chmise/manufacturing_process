events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 웹소켓 업그레이드 요청일 때만 Connection: upgrade를 보낸다
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Docker 내장 DNS. 백엔드 컨테이너가 다시 떠서 IP가 바뀌어도 따라가도록 요청 때마다 조회한다
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend_upstream http://backend:8080;

        # 백엔드 REST API
        location ^~ /api/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 알림 웹소켓 (STOMP over SockJS)
        location ^~ /ws/ {
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
        }

        # Unity WebGL 빌드 파일은 이름에 해시가 없어서 매번 변경 여부를 확인한다
        location ^~ /unity3d/ {
            add_header Cache-Control "no-cache";
        }

        # React Router 필수 설정 (새로고침해도 index.html로)
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 빌드된 정적 파일 캐싱 (파일 이름에 해시가 붙어 있음)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
