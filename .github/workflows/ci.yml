name: CI

# PR과 main push마다 백엔드 빌드·테스트, 프론트엔드 lint·빌드를 돌린다.
# 배포 워크플로(deploy.yml)도 이 워크플로를 먼저 통과해야 진행된다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard_backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build and test
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  frontend:
    name: Frontend lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dashboard_frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
